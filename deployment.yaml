apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
      - name: cicd-demo
        image: 782989862398.dkr.ecr.ap-south-1.amazonaws.com/jenkins-eks-demo:latest
        ports:
        - containerPort: 5000
